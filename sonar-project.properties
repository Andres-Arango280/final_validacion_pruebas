cat > sonar-project.properties << 'EOF'
# Identificación del proyecto
sonar.projectKey=discourse-us05-tests
sonar.projectName=Discourse US-05 Tests
sonar.projectVersion=1.0

# Rutas del código fuente
sonar.sources=app,lib
sonar.tests=spec/us05_white_box_tests,spec/us05_structural_analysis,spec/us05_api_tests,spec/us05_security_tests,spec/us05_regression_tests,cypress/e2e

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusiones
sonar.exclusions=**/node_modules/**,**/vendor/**,**/tmp/**,**/log/**,**/public/**,**/db/schema.rb

# Lenguajes
sonar.language=ruby,js

# Configuración del servidor
sonar.host.url=http://localhost:9000
sonar.token=${env.SONAR_TOKEN}
EOF

# Verificar que se creó
cat sonar-project.properties